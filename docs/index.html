            <stop offset="0" stop-color="#00d2ff"/>
            <stop offset=".5" stop-color="#00c853"/>

    <a href="#/games" data-tab="games">Games</a>

    <a href="#/books" data-tab="books">Books</a>
    <a href="#/library" data-tab="library">My apps</a>
